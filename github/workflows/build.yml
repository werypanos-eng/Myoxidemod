name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          echo "Текущие файлы в корне:"
          ls -la
          echo "Распаковываем архив..."
          # Явно указываем имя файла (проверь, чтобы оно совпадало с тем, что на GitHub)
          unzip -o "Android-Im6gui-Template-0.1.0.zip" -d .
          echo "После распаковки:"
          ls -la

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          add-to-path: true

      - name: Build with Gradle
        run: |
          # Ищем папку, где лежит gradlew
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          echo "Найден gradlew по пути: $GRADLEW_PATH"
          if [ -z "$GRADLEW_PATH" ]; then
            echo "gradlew не найден!"
            exit 1
          fi
          cd $(dirname "$GRADLEW_PATH")
          echo "Перешли в папку: $(pwd)"
          ls -la
          chmod +x gradlew
          ./gradlew assembleDebug
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu-Debug
          path: '**/app/build/outputs/apk/debug/*.apk'
